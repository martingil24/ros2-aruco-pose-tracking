# Parameters of the localization system, loaded by localization.launch.py.
# Edit this file and relaunch: no need to recompile.

# Shared by every node
/**:
  ros__parameters:
    reference_id: 1            # floor reference marker

usb_cam:
  ros__parameters:
    pixel_format: mjpeg2rgb

aruco_detector_node:
  ros__parameters:
    reference_marker_size: 0.195   # metres
    robot_marker_size: 0.10        # metres
    # Camera calibration: camera_calibration package, 7x9 inner corners, 21.3 mm squares, 640x480.
    # Full result in config/calibration/ost.yaml
    camera_matrix: [528.404410, 0.0, 333.570726, 0.0, 530.238362, 225.451059, 0.0, 0.0, 1.0]
    distortion_coefficients: [0.066997, 0.026668, -0.011476, 0.007085, 0.0]

robot_pos_node:
  ros__parameters:
    robot_ids: [0, 2, 3]       # marker IDs that are robots; any other ID is ignored
    alpha: 0.5                 # pose filter: 0 = off, closer to 1 = smoother but slower
    reset_timeout: 0.5         # [s] restart a robot filter if it was not seen for this long
